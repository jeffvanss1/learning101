name = "watchparty-app"
main = "src/worker.js"
compatibility_date = "2026-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[durable_objects]
bindings = [
  { name = "WATCH_ROOM", class_name = "WatchRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchRoom"]
