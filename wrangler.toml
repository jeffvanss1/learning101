name = "watchparty-app"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
# The Movie Database API key (v3 key or v4 read-access token).
# Prefer a Worker secret in production: `wrangler secret put TMDB_API_KEY`.
# For local dev, put it in `.dev.vars` (gitignored) instead of committing here.
TMDB_API_KEY = ""

# HMAC secret for profile session tokens. Set it in production:
#   wrangler secret put SESSION_SECRET
# (Local dev falls back to a stable dev secret — see src/auth.ts.)
# SESSION_SECRET = ""

[durable_objects]
bindings = [
  { name = "WATCH_ROOM", class_name = "WatchRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchRoom"]

# Profile persistence: users, favorites, watch history, friendships.
# The placeholder ids below are rewritten automatically by `npm run setup:remote`
# (creates the database/namespace under your account and fills in the real ids).
[[d1_databases]]
binding = "DB"
database_name = "watchparty-db"
database_id = "watchparty-db" # placeholder — filled in by `npm run setup:remote`
migrations_dir = "migrations"

# Real-time presence: presence:user:<user_id> keys with short TTLs
# (see src/presence.ts).
[[kv_namespaces]]
binding = "PRESENCE_KV"
id = "PRESENCE_KV_PLACEHOLDER" # placeholder — filled in by `npm run setup:remote`
